<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="240" viewBox="0 0 860 240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="serv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B18" />
      <stop offset="50%" stop-color="#08142A" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>

    <!-- Card Borders -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0066FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <style>
    .header-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #00D2FF;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #FFFFFF;
    }
    .card-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 400;
      fill: #94A3B8;
    }
    .tag-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 600;
      fill: #38BDF8;
    }
  </style>

  <!-- Base Container -->
  <rect width="860" height="240" rx="14" fill="url(#serv-bg)" />
  <rect x="1" y="1" width="858" height="238" rx="13" fill="none" stroke="#162E56" stroke-width="1.5" />

  <!-- Top Strip -->
  <g transform="translate(30, 28)">
    <circle cx="0" cy="0" r="4" fill="#00D2FF" />
    <text x="14" y="3.5" class="header-title">CORE BUSINESS PILLARS &amp; TECHNOLOGY CAPABILITIES</text>
  </g>

  <!-- 3 Service Cards Grid (3 Columns) -->
  <g transform="translate(24, 50)">
    
    <!-- CARD 1: Full-Stack Web Development -->
    <g transform="translate(0, 0)">
      <rect width="258" height="158" rx="8" fill="#0A1630" stroke="url(#card-border)" stroke-width="1" />
      <g transform="translate(16, 26)">
        <text class="card-title">💻 Custom Software &amp; Web</text>
        <text y="26" class="card-desc">End-to-end web platforms,</text>
        <text y="44" class="card-desc">scalable microservices, and</text>
        <text y="62" class="card-desc">high-throughput REST APIs.</text>
        <text y="92" class="tag-badge">Next.js • React • NestJS</text>
        <text y="108" class="tag-badge">Django • PostgreSQL</text>
      </g>
    </g>

    <!-- CARD 2: Mobile App Engineering -->
    <g transform="translate(276, 0)">
      <rect width="258" height="158" rx="8" fill="#0A1630" stroke="url(#card-border)" stroke-width="1" />
      <g transform="translate(16, 26)">
        <text class="card-title">📱 Mobile Applications</text>
        <text y="26" class="card-desc">Cross-platform iOS and Android</text>
        <text y="44" class="card-desc">applications with offline caching,</text>
        <text y="62" class="card-desc">geolocation, and native sensors.</text>
        <text y="92" class="tag-badge">React Native • Expo</text>
        <text y="108" class="tag-badge">iOS &amp; Android Native</text>
      </g>
    </g>

    <!-- CARD 3: Digital Commerce & Enterprise Solutions -->
    <g transform="translate(552, 0)">
      <rect width="258" height="158" rx="8" fill="#0A1630" stroke="url(#card-border)" stroke-width="1" />
      <g transform="translate(16, 26)">
        <text class="card-title">🛒 Digital Commerce &amp; POS</text>
        <text y="26" class="card-desc">Multi-seller marketplace engines,</text>
        <text y="44" class="card-desc">merchant inventory control, POS</text>
        <text y="62" class="card-desc">systems, and courier dispatch.</text>
        <text y="92" class="tag-badge">Ariiti Market • Inventory</text>
        <text y="108" class="tag-badge">POS • Dispatch Logic</text>
      </g>
    </g>

  </g>
</svg>
