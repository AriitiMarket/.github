<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="260" viewBox="0 0 900 260" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="org-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="50%" stop-color="#071126" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>

    <!-- Laser Gradient -->
    <linearGradient id="laser-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="35%" stop-color="#00D2FF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Title Glow Gradient -->
    <linearGradient id="org-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="center-glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0" />
    </radialGradient>

    <!-- Pattern -->
    <pattern id="circuit-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#162544" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="30" cy="30" r="1" fill="#00D2FF" fill-opacity="0.25" />
    </pattern>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laserRun {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1200; }
    }
    @keyframes beaconPulse {
      0% { r: 3.5px; opacity: 1; }
      75% { r: 13px; opacity: 0; }
      100% { r: 15px; opacity: 0; }
    }
    @keyframes scannerFlow {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.5; }
      80% { opacity: 0.5; }
      100% { transform: translateY(270px); opacity: 0; }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif;
      font-weight: 900;
      letter-spacing: 7px;
      font-size: 40px;
      fill: url(#org-title);
    }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      fill: #00D2FF;
    }
    .sub-role {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: 1.5px;
      font-size: 14.5px;
      fill: #CBD5E1;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #E2E8F0;
      letter-spacing: 0.5px;
    }
    .hud-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      fill: #64748B;
    }
    .status-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #00D2FF;
    }
    .laser-border {
      stroke-dasharray: 140 160;
      animation: laserRun 9s linear infinite;
    }
    .beacon-pulse {
      animation: beaconPulse 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .scanner-line {
      animation: scannerFlow 6s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="260" rx="16" fill="url(#org-bg)" />
  <rect width="900" height="260" rx="16" fill="url(#circuit-grid)" />
  <rect width="900" height="260" rx="16" fill="url(#center-glow)" />

  <!-- Animated Scanner Light -->
  <g class="scanner-line">
    <line x1="20" y1="0" x2="880" y2="0" stroke="url(#laser-cyan)" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="898" height="258" rx="15" fill="none" stroke="#162544" stroke-width="1.5" />
  <rect x="1" y="1" width="898" height="258" rx="15" fill="none" stroke="url(#laser-cyan)" stroke-width="2" class="laser-border" filter="url(#neon-glow)" />

  <!-- Corner Tech Accents -->
  <path d="M 22 36 L 22 22 L 36 22" stroke="#00D2FF" stroke-width="2.5" fill="none" />
  <path d="M 878 36 L 878 22 L 864 22" stroke="#6366F1" stroke-width="2.5" fill="none" />
  <path d="M 22 224 L 22 238 L 36 238" stroke="#00D2FF" stroke-width="2.5" fill="none" />
  <path d="M 878 224 L 878 238 L 864 238" stroke="#6366F1" stroke-width="2.5" fill="none" />

  <!-- Top Left Terminal Title Bar -->
  <g transform="translate(36, 26)">
    <circle cx="0" cy="0" r="4.5" fill="#EF4444" opacity="0.85" />
    <circle cx="14" cy="0" r="4.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="28" cy="0" r="4.5" fill="#00D2FF" opacity="0.85" />
    <text x="46" y="3.5" class="hud-meta">ORG: ARIITI TECHNOLOGIES // SYS_ID: AT-HQ // ETHIOPIA 🇪🇹</text>
  </g>

  <!-- Top Right Live Status Pill -->
  <g transform="translate(680, 18)">
    <rect width="184" height="26" rx="13" fill="#09142A" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="13" r="3.5" fill="none" stroke="#00D2FF" stroke-width="1.5" class="beacon-pulse" />
    <circle cx="18" cy="13" r="3.5" fill="#00D2FF" />
    <text x="32" y="16.5" class="status-text">ENTERPRISE SOLUTIONS</text>
  </g>

  <!-- Center Branding Elements -->
  <g text-anchor="middle" transform="translate(450, 0)">
    <!-- Small Eyebrow Tag -->
    <g transform="translate(0, 78)">
      <rect x="-205" y="-14" width="410" height="22" rx="11" fill="#09142A" stroke="#162E56" stroke-width="1" />
      <text y="1.5" class="eyebrow">✦ SOFTWARE • IT NETWORKING • DIGITAL COMMERCE ✦</text>
    </g>

    <!-- Company Name -->
    <text y="130" class="title-text">ARIITI TECHNOLOGIES</text>

    <!-- Mission Subtitle -->
    <text y="166" class="sub-role">Building Scalable Digital Products, Enterprise Systems &amp; Modern IT Infrastructure</text>

    <!-- Service Pillar Badges -->
    <g transform="translate(-330, 196)">
      <!-- Pillar 1: Software & Mobile Development -->
      <g transform="translate(0, 0)">
        <rect width="200" height="28" rx="8" fill="#0A1630" stroke="#1E3A6E" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#00D2FF" />
        <text x="30" y="18" class="badge-label">Software &amp; Mobile Dev</text>
      </g>
      <!-- Pillar 2: Network Infrastructure -->
      <g transform="translate(220, 0)">
        <rect width="210" height="28" rx="8" fill="#0A1630" stroke="#1E3A6E" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#38BDF8" />
        <text x="30" y="18" class="badge-label">Network &amp; IT Infrastructure</text>
      </g>
      <!-- Pillar 3: Digital Commerce -->
      <g transform="translate(450, 0)">
        <rect width="210" height="28" rx="8" fill="#0A1630" stroke="#1E3A6E" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#6366F1" />
        <text x="30" y="18" class="badge-label">Digital Commerce &amp; POS</text>
      </g>
    </g>
  </g>

  <!-- Bottom Coordinates Meta -->
  <text x="36" y="244" class="hud-meta">GLOBAL CONNECTIVITY // HIGH-PERFORMANCE CLOUD ARCHITECTURE</text>
  <text x="864" y="244" text-anchor="end" class="hud-meta">OFFICIAL CHANNELS: FACEBOOK · TELEGRAM · GITHUB</text>
</svg>
